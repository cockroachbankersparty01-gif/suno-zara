# Everything here is free and open-source, running on your own machine.
#   docker compose up -d                      → Postgres + Ollama (lyrics LLM)
# ACE-Step (the music model) runs outside Docker so it can use your GPU / Apple Silicon directly —
# see README → "Run the real music model".
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sunozara
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on first start: auth stub, then the schema.
      - ./supabase/dev_auth_stub.sql:/docker-entrypoint-initdb.d/00_auth_stub.sql:ro
      - ./supabase/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

  # Free local LLM for lyrics + prompt enhancement. First run:
  #   docker compose exec ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
