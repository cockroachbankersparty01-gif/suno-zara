# Render Blueprint — one free web service running the Suno Zara API + worker.
# Render → New → Blueprint → pick this repo. It will ask for the values marked `sync: false`.
services:
  - type: web
    name: suno-zara
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_BASE_URL
        value: auto
      - key: AUTH_MODE
        value: supabase
      - key: STORAGE_DRIVER
        value: supabase
      - key: STORAGE_BUCKET
        value: media
      # Paste these from your Supabase project (see PHONE_SETUP.md):
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Songs are made by the GPU worker (Kaggle notebook), not here: this server has no GPU.
      # Requests wait in the queue until the notebook is running. Set RUN_WORKER=true for practice tunes instead.
      - key: MUSIC_PROVIDER
        value: mock
      - key: LYRICS_PROVIDER
        value: mock
      - key: IMAGE_PROVIDER
        value: pollinations
      - key: DEFAULT_DURATION_SEC
        value: "180"
      - key: RUN_WORKER
        value: "false"
