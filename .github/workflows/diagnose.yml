# Checks the live server: config, music worker status and the latest song errors (no secrets shown).
name: Diagnose server
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Server status
        run: |
          SERVER=https://suno-zara.onrender.com
          for i in 1 2 3 4 5 6; do curl -s --max-time 70 -o status.json -w "%{http_code}\n" $SERVER/status && [ -s status.json ] && break; sleep 10; done
          jq . status.json || cat status.json
          echo "--- config"; curl -s --max-time 60 $SERVER/config | jq -c '{authMode, unlimited}'
