# Builds the Suno Zara Android APK on GitHub's servers — free, nothing to install.
# Run it from the "Actions" tab → "Build APK" → "Run workflow".
# The APK appears under "Artifacts" at the bottom of the finished run.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write   # lets the workflow publish the APK as a Release

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME is preset) — no setup step needed.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package.json') }}

      - name: Install dependencies
        run: bash scripts/setup.sh

      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true   # report type issues without blocking the APK

      - name: Build release APK
        run: bash scripts/build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SunoZara-apk
          path: apps/mobile/dist/SunoZara.apk
          if-no-files-found: error

      # Publishes the APK as a Release, so it can be downloaded straight to a phone:
      # https://github.com/<you>/suno-zara/releases/latest
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist/SunoZara.apk \
            --repo "${{ github.repository }}" \
            --title "Suno Zara $TAG" \
            --notes "Tap **SunoZara.apk** below to download, then open it to install. Built from ${{ github.sha }}." \
            --latest
